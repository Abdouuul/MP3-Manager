{% extends 'base.html' %}

{% block title %} <title>New User Registration</title> {% endblock %}

{% block content %}
    <div class="container">
        <h1>New User Registration</h1>
        <form action="{{url_for('controller_bp.register')}}" method="POST">
            <div class="form-group">
                <label for="name" class="form-control-label">Firstname</label>
                <input type="text" name="firstname" class="form-control">
            </div>
            <div class="form-group">
                <div>
                    <label for="lastname" class="form-control-label">Lastname</label>
                    <input type="text" name="lastname" class="form-control" />
                </div>
            </div>
            <div class="form-group">
                <div>
                    <label for="username" class="form-control-label">Username</label>
                    <input type="text" name="username" class="form-control" />
                </div>
            </div>
            <div class="form-group">
                <div>
                    <label for="city" class="form-control-label">City</label>
                    <input type="text" name="city" class="form-control" />
                </div>
            </div>
            <div class="form-group">
                <div>
                    <label for="country" class="form-control-label">Country</label>
                    <input type="text" name="country" class="form-control" />
                </div>
            </div>
            
            <div class="form-group">
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>       
    
{% endblock %}
